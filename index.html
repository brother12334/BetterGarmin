<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0b0f" />
    <meta
      name="description"
      content="BetterGarmin — a sleeker, deeper dashboard for your Garmin health data. 100% local, nothing ever uploaded."
    />
    <title>BetterGarmin</title>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('bettergarmin:theme');
          var theme = stored === 'light' || stored === 'system' ? stored : 'dark';
          if (theme !== 'system') document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
