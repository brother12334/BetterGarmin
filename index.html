<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0b0f" />
    <!-- Home-screen app on iPhone: draw under the status bar instead of a solid bar above the page. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="Sleep, heart rate, training load and recovery from your Garmin watch in one fast dashboard. Runs in your browser; optional cloud sync you host yourself." />
    <title>BetterGarmin</title>
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="BetterGarmin" />
    <meta property="og:title" content="BetterGarmin" />
    <meta property="og:description" content="Sleep, heart rate, training load and recovery from your Garmin watch in one fast dashboard. Runs in your browser; optional cloud sync you host yourself." />
    <meta property="og:url" content="%SITE_URL%" />
    <meta property="og:image" content="%SITE_URL%og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="BetterGarmin: your Garmin data, readable at a glance." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="BetterGarmin" />
    <meta name="twitter:description" content="Sleep, heart rate, training load and recovery from your Garmin watch in one fast dashboard. Runs in your browser; optional cloud sync you host yourself." />
    <meta name="twitter:image" content="%SITE_URL%og.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('bettergarmin:theme');
          var theme = stored === 'light' || stored === 'system' ? stored : 'dark';
          if (theme !== 'system') document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
