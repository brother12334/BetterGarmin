name: Sync Garmin data

# Optional, opt-in feature (see docs/cloud-sync.md). Disabled until the repo's
# secrets below are configured — the "Check prerequisites" step exits cleanly
# if they're missing instead of failing loudly on every scheduled run.
#
# Runs garmindb_cli.py on a schedule, restoring/saving its working database
# files to a Cloudflare R2 bucket (S3-compatible, free tier) so state
# persists across runs on GitHub's ephemeral runners. A Cloudflare Worker
# (see worker/) serves those files to the BetterGarmin frontend behind an
# access token — see docs/cloud-sync.md for full setup.

on:
  schedule:
    # Every hour. Garmin Connect can flag accounts that log in too often —
    # don't go much tighter than this. Public repos get unlimited free
    # Actions minutes, so the cost here is Garmin's tolerance, not GitHub's.
    - cron: '17 * * * *'
  workflow_dispatch:

concurrency:
  group: sync-garmin-data
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    # The first full backfill can take a long time; hourly incremental runs take a few minutes.
    timeout-minutes: 120
    env:
      AWS_DEFAULT_REGION: auto
      DB_DIR: /home/runner/HealthData/DBs
    steps:
      - name: Check prerequisites
        id: check
        run: |
          missing=()
          [ -z "${{ secrets.GARMIN_USERNAME }}" ] && missing+=("GARMIN_USERNAME")
          [ -z "${{ secrets.GARMIN_PASSWORD }}" ] && missing+=("GARMIN_PASSWORD")
          [ -z "${{ secrets.R2_ACCOUNT_ID }}" ] && missing+=("R2_ACCOUNT_ID")
          [ -z "${{ secrets.R2_ACCESS_KEY_ID }}" ] && missing+=("R2_ACCESS_KEY_ID")
          [ -z "${{ secrets.R2_SECRET_ACCESS_KEY }}" ] && missing+=("R2_SECRET_ACCESS_KEY")
          [ -z "${{ secrets.R2_BUCKET_NAME }}" ] && missing+=("R2_BUCKET_NAME")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::warning::Cloud sync is not configured yet — missing secrets: ${missing[*]}. See docs/cloud-sync.md. Skipping this run."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      # Secrets pasted from a web page often carry stray spaces/line breaks, and the account ID is
      # sometimes pasted as the whole endpoint URL. Normalise all of that before anything uses them.
      - name: Normalise R2 settings
        if: steps.check.outputs.ready == 'true'
        env:
          RAW_ACCOUNT: ${{ secrets.R2_ACCOUNT_ID }}
          RAW_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RAW_SECRET: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RAW_BUCKET: ${{ secrets.R2_BUCKET_NAME }}
        run: |
          clean() { printf '%s' "$1" | tr -d '[:space:]'; }
          account=$(clean "$RAW_ACCOUNT"); account=${account#https://}; account=${account#http://}; account=${account%%.*}
          key_id=$(clean "$RAW_KEY_ID"); secret=$(clean "$RAW_SECRET"); bucket=$(clean "$RAW_BUCKET")
          echo "::add-mask::$account"; echo "::add-mask::$key_id"; echo "::add-mask::$secret"
          if ! [[ "$account" =~ ^[0-9a-f]{32}$ ]]; then
            echo "::error::R2_ACCOUNT_ID doesn't look like a Cloudflare account ID (32 hex characters)."
            exit 1
          fi
          {
            echo "AWS_ACCESS_KEY_ID=$key_id"
            echo "AWS_SECRET_ACCESS_KEY=$secret"
            echo "R2_ENDPOINT=https://$account.r2.cloudflarestorage.com"
            echo "R2_BUCKET=$bucket"
          } >> "$GITHUB_ENV"

      - name: Set up Python
        if: steps.check.outputs.ready == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install garmindb
        if: steps.check.outputs.ready == 'true'
        run: pip install garmindb

      # Checked before logging in to Garmin, so a bad key doesn't spend a Garmin login attempt.
      - name: Verify R2 access
        if: steps.check.outputs.ready == 'true'
        run: |
          if ! aws --endpoint-url "$R2_ENDPOINT" s3 ls "s3://$R2_BUCKET/" > /tmp/r2.log 2>&1; then
            cat /tmp/r2.log
            echo "::error::Cloudflare R2 rejected the credentials. Check R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY and R2_BUCKET_NAME, and that the R2 API token has Object Read & Write on this bucket."
            exit 1
          fi

      - name: Restore previous database state from R2
        if: steps.check.outputs.ready == 'true'
        run: |
          mkdir -p "$DB_DIR"
          aws --endpoint-url "$R2_ENDPOINT" s3 sync "s3://$R2_BUCKET/DBs" "$DB_DIR"
          if [ -z "$(ls -A "$DB_DIR" 2>/dev/null)" ]; then
            echo "No existing data in R2 — this will be a full first-time sync (can take a while)."
            echo "first_run=true" >> "$GITHUB_ENV"
          else
            echo "first_run=false" >> "$GITHUB_ENV"
          fi

      - name: Write GarminDB config
        if: steps.check.outputs.ready == 'true'
        run: |
          mkdir -p ~/.GarminDb
          cat > ~/.GarminDb/GarminConnectConfig.json <<CONFIG
          {
            "db": { "type": "sqlite" },
            "garmin": { "domain": "garmin.com" },
            "credentials": {
              "user": "${{ secrets.GARMIN_USERNAME }}",
              "secure_password": false,
              "password": "${{ secrets.GARMIN_PASSWORD }}",
              "password_file": null
            },
            "data": {
              "weight_start_date": "${{ vars.SYNC_START_DATE || '01/01/2023' }}",
              "sleep_start_date": "${{ vars.SYNC_START_DATE || '01/01/2023' }}",
              "rhr_start_date": "${{ vars.SYNC_START_DATE || '01/01/2023' }}",
              "hrv_start_date": "${{ vars.SYNC_START_DATE || '01/01/2023' }}",
              "monitoring_start_date": "${{ vars.SYNC_START_DATE || '01/01/2023' }}",
              "download_latest_activities": 25,
              "download_all_activities": 1000
            },
            "directories": { "relative_to_home": true, "base_dir": "HealthData", "mount_dir": "/Volumes/GARMIN" },
            "enabled_stats": { "monitoring": true, "steps": true, "itime": true, "sleep": true, "rhr": true, "hrv": true, "weight": true, "activities": true },
            "course_views": { "steps": [] },
            "modes": {},
            "activities": { "display": [] },
            "settings": { "metric": true, "default_display_activities": ["walking", "running", "cycling"] },
            "checkup": { "look_back_days": 90 }
          }
          CONFIG

      - name: Run GarminDB (first-time full sync)
        if: steps.check.outputs.ready == 'true' && env.first_run == 'true'
        run: |
          set -o pipefail
          garmindb_cli.py --all --download --import --analyze 2>&1 | tee /tmp/garmindb.log
          # GarminDB exits 0 even when it can't log in — never let that pass as a successful sync.
          if grep -q "Failed to login" /tmp/garmindb.log; then
            echo "::error::Garmin Connect login failed. Check GARMIN_USERNAME / GARMIN_PASSWORD. Accounts with two-step verification can't be used by this automated login."
            exit 1
          fi

      - name: Run GarminDB (incremental sync)
        if: steps.check.outputs.ready == 'true' && env.first_run == 'false'
        run: |
          set -o pipefail
          garmindb_cli.py --all --download --import --analyze --latest 2>&1 | tee /tmp/garmindb.log
          # GarminDB exits 0 even when it can't log in — never let that pass as a successful sync.
          if grep -q "Failed to login" /tmp/garmindb.log; then
            echo "::error::Garmin Connect login failed. Check GARMIN_USERNAME / GARMIN_PASSWORD. Accounts with two-step verification can't be used by this automated login."
            exit 1
          fi

      - name: Upload updated database state to R2
        if: steps.check.outputs.ready == 'true'
        run: |
          # Never mirror an empty folder up: with --delete that would wipe the stored history.
          if [ -z "$(ls -A "$DB_DIR" 2>/dev/null)" ]; then
            echo "::error::GarminDB produced no database files — not uploading."
            exit 1
          fi
          aws --endpoint-url "$R2_ENDPOINT" s3 sync "$DB_DIR" "s3://$R2_BUCKET/DBs" --delete

      - name: Clean up credentials
        if: always()
        run: rm -rf ~/.GarminDb
